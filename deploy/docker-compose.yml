# Vitrine estatica: um nginx com bind mount. Publicar e copiar o index.html —
# sem build, sem restart. Nao ha API aqui: o botao Apoiar aponta para a pagina
# unica em firawynix.com.br/apoie, que ja concentra os apoios de todos os sites.
services:
  site:
    image: nginx:alpine
    container_name: firawselector-mock
    restart: unless-stopped
    ports:
      # so o tunel alcanca: nada de 0.0.0.0, senao o site fica exposto na LAN
      # por cima da Cloudflare.
      - "127.0.0.1:${PORTA_SITE:-26003}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
